name: backfill

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: Max videos in this run
        default: "20"

permissions:
  contents: write

concurrency:
  group: moneyprint-video
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Pull state.json from logs branch
        run: |
          git fetch origin logs:refs/remotes/origin/logs || true
          if git rev-parse --verify origin/logs >/dev/null 2>&1; then
            git show origin/logs:state.json > state.json || echo "[]" > state.json
            git show origin/logs:views_history.json > views_history.json 2>/dev/null || true
          else
            echo "[]" > state.json
          fi

      - name: Sync state between videos
        run: |
          git config user.name "moneyprint-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin logs || true
          if git rev-parse --verify origin/logs >/dev/null 2>&1; then
            git checkout -f -B logs origin/logs
            cp -f "$GITHUB_WORKSPACE/state.json" state.json 2>/dev/null || true
          else
            git checkout --orphan logs
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          git add -f state.json views_history.json 2>/dev/null || true
          git commit -m "state mid-backfill ${{ github.run_id }}" || true
          git push origin logs || true

      - name: Top up channels to daily target
        env:
          GEMINI_KEY_A: ${{ secrets.GEMINI_KEY_A }}
          GEMINI_KEY_B: ${{ secrets.GEMINI_KEY_B }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_MODEL_FALLBACK: ${{ secrets.GEMINI_MODEL_FALLBACK }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CHANNEL_1_NAME: ${{ vars.CHANNEL_1_NAME || 'ReZain' }}
          CHANNEL_2_NAME: ${{ vars.CHANNEL_2_NAME || 'Channel2' }}
          CHANNEL_3_NAME: ${{ vars.CHANNEL_3_NAME || 'Channel3' }}
          NICHE: ${{ vars.NICHE || 'space science documentary facts' }}
          NICHE_2: ${{ vars.NICHE_2 || 'human history documentaries - ancient empires, famous wars, kings queens and historical figures, mysteries of lost civilizations' }}
          NICHE_3: ${{ vars.NICHE_3 || 'doi song tieng Viet giai thich bang hoat hinh - co the, giac ngu, an uong, tien, thoi quen, thoi tiet, meo dung dien thoai va may tinh, nhung dieu binh thuong ngay ma it nguoi biet' }}
          VOICE: ${{ vars.VOICE || 'en-US-ChristopherNeural' }}
          VOICE_2: ${{ vars.VOICE_2 || 'en-US-GuyNeural' }}
          VOICE_3: ${{ vars.VOICE_3 || 'vi-VN-NamMinhNeural' }}
          TARGET_ACC1: ${{ vars.TARGET_ACC1 || '4' }}
          TARGET_ACC2: ${{ vars.TARGET_ACC2 || '8' }}
          TARGET_ACC3: ${{ vars.TARGET_ACC3 || '3' }}
          MAX_DAILY_UPLOADS: "40"
        run: python main.py backfill --max "${{ github.event.inputs.max || '20' }}"

      - name: Push final state
        if: always()
        run: |
          rm -rf cache output || true
          cp -f "$GITHUB_WORKSPACE/state.json" /tmp/mp_state.json || echo "[]" > /tmp/mp_state.json
          git config user.name "moneyprint-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin logs || true
          if git rev-parse --verify origin/logs >/dev/null 2>&1; then
            git checkout -f -B logs origin/logs
          else
            git checkout --orphan logs
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          cp -f /tmp/mp_state.json state.json
          git add -f state.json views_history.json 2>/dev/null || true
          git commit -m "state backfill ${{ github.run_id }}" || true
          git push origin logs
