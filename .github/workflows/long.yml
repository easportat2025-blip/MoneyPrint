name: long

on:
  # ACC A (ReZain) tam khoa: YouTube refresh token da bi thu hoi (invalid_grant).
  # Mo lai bang cach bo comment dong nay.
  repository_dispatch:
    types: [long-video]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moneyprint-video
  cancel-in-progress: false

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Pull state.json from logs branch
        run: |
          git fetch origin logs:refs/remotes/origin/logs || true
          if git rev-parse --verify origin/logs >/dev/null 2>&1; then
            git show origin/logs:state.json > state.json || echo "[]" > state.json
          else
            echo "[]" > state.json
          fi

      - name: Run long video
        env:
          SCHEDULE: long
          CHANNEL: "1"
          GEMINI_KEY_A: ${{ secrets.GEMINI_KEY_A }}
          GEMINI_KEY_B: ${{ secrets.GEMINI_KEY_B }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_MODEL_FALLBACK: ${{ secrets.GEMINI_MODEL_FALLBACK }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NICHE: ${{ vars.NICHE || 'explained - how everyday technology and science actually works - sleep, memory, money, internet, phones, human body, physics of daily life, psychology of habits' }}
          VOICE: ${{ vars.VOICE || 'en-US-ChristopherNeural' }}
          VISUAL_STYLE: ${{ vars.VISUAL_STYLE || 'stickman' }}
          STICKMAN_FPS: ${{ vars.STICKMAN_FPS || '30' }}
          STICKMAN_SCENE_SEC: ${{ vars.STICKMAN_SCENE_SEC || '14' }}
          LONG_TARGET_SEC: ${{ vars.LONG_TARGET_SEC || '420' }}
          MAX_DAILY_UPLOADS: ${{ vars.MAX_DAILY_UPLOADS || '30' }}
        run: python main.py long

      - name: Push state to logs branch
        if: always()
        run: |
          rm -rf cache output || true
          cp -f "$GITHUB_WORKSPACE/state.json" /tmp/mp_state.json || echo "[]" > /tmp/mp_state.json
          git config user.name "moneyprint-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin logs || true
          if git rev-parse --verify origin/logs >/dev/null 2>&1; then
            git checkout -f -B logs origin/logs
          else
            git checkout --orphan logs
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          cp -f /tmp/mp_state.json state.json
          git add -f state.json
          git commit -m "state long ${{ github.run_id }}" || true
          git push origin logs
